<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#bg)"/>
  <!-- ラベル(プリンタから出てくる紙) -->
  <g transform="rotate(-6 60 40)">
    <rect x="34" y="14" width="52" height="40" rx="5" fill="#ffffff"/>
    <!-- ハート -->
    <path d="M50 30 c0-4 6-6 8-1.5 c2-4.5 8-2.5 8 1.5 c0 5-8 10-8 10 s-8-5-8-10z" fill="#f472b6"/>
    <!-- 文字の行 -->
    <rect x="70" y="25" width="10" height="3.5" rx="1.75" fill="#93c5fd"/>
    <rect x="70" y="32" width="8" height="3.5" rx="1.75" fill="#93c5fd"/>
    <rect x="40" y="44" width="40" height="3.5" rx="1.75" fill="#bfdbfe"/>
  </g>
  <!-- プリンタ本体 -->
  <rect x="20" y="52" width="80" height="50" rx="14" fill="#1e3a8a"/>
  <rect x="20" y="52" width="80" height="44" rx="14" fill="#ffffff"/>
  <!-- 排紙口 -->
  <rect x="30" y="58" width="60" height="6" rx="3" fill="#1e3a8a"/>
  <!-- ボタンとランプ -->
  <circle cx="60" cy="81" r="7.5" fill="#2563eb"/>
  <circle cx="60" cy="81" r="3" fill="#ffffff"/>
  <circle cx="84" cy="81" r="3" fill="#34d399"/>
</svg>
